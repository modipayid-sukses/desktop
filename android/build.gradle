buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}



allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        def androidExtension = subproject.extensions.findByName("android")
        if (androidExtension != null) {
            if (androidExtension.hasProperty("namespace")) {
                def currentNamespace = androidExtension.namespace
                if (currentNamespace == null || currentNamespace.toString().trim().isEmpty()) {
                    def manifestFile = subproject.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def manifest = new XmlSlurper(false, false).parse(manifestFile)
                        def manifestPackage = manifest.@package?.text()
                        if (manifestPackage != null && !manifestPackage.trim().isEmpty()) {
                            androidExtension.namespace = manifestPackage
                        }
                    }
                }
            }
        }
    }
}

gradle.projectsEvaluated {
    subprojects { subproject ->
        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
            def javaTaskName = task.name.replace("Kotlin", "JavaWithJavac")
            def javaTask = subproject.tasks.findByName(javaTaskName)
            def jvmTarget = "17"

            if (javaTask != null && javaTask.hasProperty("targetCompatibility")) {
                def targetCompatibility = javaTask.targetCompatibility?.toString()
                if (targetCompatibility != null && !targetCompatibility.trim().isEmpty()) {
                    jvmTarget = targetCompatibility
                }
            } else {
                def androidExtension = subproject.extensions.findByName("android")
                def configuredTarget = androidExtension?.kotlinOptions?.jvmTarget?.toString()
                if (configuredTarget != null && !configuredTarget.trim().isEmpty()) {
                    jvmTarget = configuredTarget
                }
            }

            task.kotlinOptions.jvmTarget = jvmTarget
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
