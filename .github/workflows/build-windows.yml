name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - desktop

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release
        env:
          # firebase_cpp_sdk_windows ships a CMakeLists.txt requiring an old
          # cmake_minimum_required version that newer CMake (4.x) on the
          # runner rejects outright. This env var tells CMake to accept it.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          # local_auth_windows / permission_handler_windows use WinRT code
          # generated against the old <experimental/coroutine> TS, which the
          # runner's MSVC toolset now hard-errors on instead of just warning.
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: modipay-windows
          path: build/windows/x64/runner/Release/
